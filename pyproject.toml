[project]
name = "authorization-types"
version = "0.1.0"
description = "Example authorization types"
authors = [
    {name = "takentui",email = "takentui@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "python-jose[cryptography]>=3.3.0",
    "uvicorn (>=0.34.2,<0.35.0)",
    "pydantic (>=2.11.4,<3.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "PyJWT (>=2.8.0,<3.0.0)",
    "mypy (>=1.17.1,<2.0.0)",
    "types-passlib (>=1.7.7.20250602,<2.0.0.0)",
    "pytest-env (>=1.1.5,<2.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "pytest-mock (>=3.14.1,<4.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-mock (>=3.15.1,<4.0.0)"
]
